<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <!-- Accent Gradient for Text/Shapes -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Decorative Shapes / Glowing Orbs -->
  <circle cx="200" cy="100" r="120" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="150" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="200" r="80" fill="#f43f5e" opacity="0.1" filter="url(#glow)" />

  <!-- Geometric Abstract Lines -->
  <path d="M-100,200 Q300,50 600,200 T1300,200" fill="none" stroke="url(#accent-grad)" stroke-width="4" opacity="0.3" />
  <path d="M-100,250 Q400,150 800,250 T1300,150" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.2" />

  <!-- Main Title -->
  <text x="50%" y="45%" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#accent-grad)" letter-spacing="2">
    AWESOME CHAIN-OF-DRAFT
  </text>

  <!-- Subtitle -->
  <text x="50%" y="65%" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="4">
    MINIMALISTIC &amp; HIGH-EFFICIENCY LLM REASONING
  </text>

  <!-- Inner border/frame -->
  <rect x="20" y="20" width="1160" height="360" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
</svg>
